[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_pack_gmail*"]

[tool.setuptools.package-data]
"lisa_pack_gmail" = [
  "content/**/*.md",
  "modes/**/*.md",
  "operations/**/*.yml",
  "operations/**/*.py",
  "tools/**/*.yml",
]

[project]
name = "lisa-pack-gmail"
version = "0.1.0"
description = "Lisa Gmail pack - draft email creation via the Gmail REST API"
requires-python = ">=3.11"

dependencies = [
  "lisa-kernel",
  "lisa-sdk",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=6.0.0",
  "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: hits real external provider APIs and prints a tester-visible summary",
  "integration: multi-module in-process test",
  "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
gmail = "lisa_pack_gmail:get_content_root"