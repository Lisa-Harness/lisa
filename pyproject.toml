[project]
name = "lisa-framework-workspace"
version = "0.1.0"
description = "Workspace for the public Lisa framework packages and examples"
requires-python = ">=3.11"
dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "lisa-mcp-servers",
    "lisa-pack-memory",
    "lisa-pack-coding",
    "lisa-pack-core",
    "lisa-pack-letta",
    "lisa-pack-introspect",
    "lisa-pack-search",
    "lisa-pack-models",
    "lisa-pack-checkpoint",
    "lisa-pack-markdown",
    "lisa-pack-compaction",
    "lisa-host-core",
    "lisa-host-cli",
    "lisa-host-web",
    "lisa-host-vscode",
    "lisa-host",
    "rich>=13.7.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
    "vulture>=2.11",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "kernel",
    "sdk",
    "mcp_server",
    "sdk/packs/core",
    "sdk/packs/introspect",
    "sdk/packs/letta",
    "sdk/packs/memory",
    "sdk/packs/search",
    "sdk/packs/models",
    "sdk/packs/checkpoint",
    "sdk/packs/markdown",
    "sdk/packs/compaction",
    "hosts/core",
    "hosts/cli",
    "hosts/web",
    "hosts/vscode",
    "packaging/lisa-host",
]

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }
lisa-mcp-servers = { workspace = true }
lisa-pack-letta = { workspace = true }
lisa-pack-memory = { workspace = true }
lisa-pack-coding = { path = "../lisa_packs/coding" }
lisa-pack-cloudflare = { path = "../lisa_packs/cloudflare" }
lisa-pack-github = { path = "../lisa_packs/github" }
lisa-pack-stripe = { path = "../lisa_packs/stripe" }
lisa-pack-core = { workspace = true }
lisa-pack-models = { workspace = true }
lisa-pack-introspect = { workspace = true }
lisa-pack-search = { workspace = true }
lisa-pack-checkpoint = { workspace = true }
lisa-pack-markdown = { workspace = true }
lisa-pack-compaction = { workspace = true }
lisa-pack-mem0 = { path = "../lisa_packs/mem0" }
lisa-pack-brave-search = { path = "../lisa_packs/brave_search" }
lisa-pack-gmail = { path = "../lisa_packs/gmail" }
lisa-host-core = { workspace = true }
lisa-host-cli = { workspace = true }
lisa-host-web = { workspace = true }
lisa-host-vscode = { workspace = true }
lisa-host = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 50
max-locals = 15

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["vulture_allowlist.py"]

[tool.vulture]
min_confidence = 80
exclude = [
    "**/tests/",
    "**/test_*.py",
    "**/conftest.py",
    "**/*egg-info*/",
    "**/__pycache__/",
    ".venv/",
    "debug_err.py",
    "test_mcp.py",
]
ignore_names = [
    "main",
    "mcp",
    "init_*",
    "build_*",
    "get_*",
    "register_*",
    "discover_*",
    "resolve_*",
    "*SignalCollector",
    "*Collector",
    "*ProcessingLoop",
    "*Detector",
    "*Registry",
    "*Store",
    "*Broker",
    "*Catalog",
    "*Spec",
    "*Config",
    "*Policy",
    "*Manifest",
    "*Error",
    "*Exception",
    "*Context",
    "*Fragments",
    "*Sections",
    "*Evidence",
    "*Summary",
    "*Anomalies",
]
ignore_decorators = [
    "@mcp.tool",
    "@property",
    "@router.get",
    "@router.post",
]