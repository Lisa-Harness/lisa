[project]
name = "lisa-framework-workspace"
version = "0.1.0"
description = "Workspace for the public Lisa framework packages and examples"
requires-python = ">=3.11"
dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "lisa-mcp-servers",
    "lisa-pack-memory",
    "lisa-pack-core",
    "lisa-pack-introspect",
    "lisa-pack-checkpoint",
    "lisa-pack-compaction",
    "lisa-pack-recovery",
    "lisa-host-core",
    "lisa-host-cli",
    "lisa-host-web",
    "lisa-host",
    "rich>=13.7.0",
    "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "import-linter>=2.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
    "vulture>=2.11",
]
ext = [
    # Public external packs (resolve from ../lisa-packs/ via [tool.uv.sources]).
    # Install with `uv sync --extra ext`. Requires the lisa-packs sibling checkout.
    "lisa-pack-brave-search",
    "lisa-pack-markdown",
    "lisa-pack-okf",
    "lisa-pack-search",
]
wip = [
    # WIP external packs (resolve from ../lisa-packs-wip/). Install with
    # `uv sync --extra wip`. Requires the lisa-packs-wip sibling checkout.
    "lisa-pack-cloudflare",
    "lisa-pack-coding",
    "lisa-pack-github",
    "lisa-pack-gmail",
    "lisa-pack-stripe",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "kernel",
    "sdk",
    "mcp_server",
    "sdk/packs/core",
    "sdk/packs/introspect",
    "sdk/packs/memory",
    "sdk/packs/checkpoint",
    "sdk/packs/compaction",
    "sdk/packs/recovery",
    "hosts/core",
    "hosts/cli",
    "hosts/web",
    "packaging/lisa-host",
]

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }
lisa-mcp-servers = { workspace = true }
lisa-pack-memory = { workspace = true }
lisa-pack-coding = { path = "../lisa-packs-wip/coding" }
lisa-pack-cloudflare = { path = "../lisa-packs-wip/cloudflare" }
lisa-pack-github = { path = "../lisa-packs-wip/github" }
lisa-pack-stripe = { path = "../lisa-packs-wip/stripe" }
lisa-pack-core = { workspace = true }
lisa-pack-introspect = { workspace = true }
lisa-pack-checkpoint = { workspace = true }
lisa-pack-compaction = { workspace = true }
lisa-pack-recovery = { workspace = true }
lisa-pack-okf = { path = "../lisa-packs/okf" }
lisa-pack-mem0 = { path = "../lisa-packs/mem0" }
lisa-pack-brave-search = { path = "../lisa-packs/brave_search" }
lisa-pack-gmail = { path = "../lisa-packs-wip/gmail" }
lisa-pack-search = { path = "../lisa-packs/search" }
lisa-pack-markdown = { path = "../lisa-packs/markdown" }
lisa-pack-letta = { path = "../lisa-packs/letta" }
lisa-host-core = { workspace = true }
lisa-host-cli = { workspace = true }
lisa-host-web = { workspace = true }
lisa-host = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
# Test files use function-local imports (lazy dep loading) and literal
# values in assertions — both are intentional and noisy under PLC0415/PLR2004.
"**/tests/**" = ["PLC0415", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 50
max-locals = 15

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["vulture_allowlist.py"]

[tool.vulture]
min_confidence = 80
exclude = [
    "**/tests/",
    "**/test_*.py",
    "**/conftest.py",
    "**/*egg-info*/",
    "**/__pycache__/",
    ".venv/",
    "debug_err.py",
    "test_mcp.py",
]
ignore_names = [
    "main",
    "mcp",
    "init_*",
    "build_*",
    "get_*",
    "register_*",
    "discover_*",
    "resolve_*",
    "*SignalCollector",
    "*Collector",
    "*ProcessingLoop",
    "*Detector",
    "*Registry",
    "*Store",
    "*Broker",
    "*Catalog",
    "*Spec",
    "*Config",
    "*Policy",
    "*Manifest",
    "*Error",
    "*Exception",
    "*Context",
    "*Fragments",
    "*Sections",
    "*Evidence",
    "*Summary",
    "*Anomalies",
]
ignore_decorators = [
    "@mcp.tool",
    "@property",
    "@router.get",
    "@router.post",
]

# ---------------------------------------------------------------------------
# import-linter — enforces the architectural boundaries documented in
# docs/BOUNDARIES.md.  Run with:  uv run lint-imports
#
# The codebase uses root-level import paths (kernel, sdk, hosts.* , mcp_server)
# rather than installed distribution names, so we use those here.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "kernel",
    "sdk",
    "mcp_server",
    "hosts",
]

# Kernel is runtime-neutral — must never import from hosts.
# (kernel → sdk and kernel → mcp_server are allowed; sdk/mcp_server depend on kernel,
# not the other way around.)
[[tool.importlinter.contracts]]
name = "Kernel runtime-neutrality (kernel imports nothing from hosts)"
type = "forbidden"
source_modules = ["kernel"]
forbidden_modules = [
    "hosts",
    "hosts.core",
    "hosts.cli",
    "hosts.web",
]

# SDK must not import host transports (cli/web) or mcp_server internals.
# SDK and packs may import hosts.core (transport-neutral runtime services:
# thread, model_runtime, state_provider, turn_hooks_builder). See
# docs/BOUNDARIES.md "Packs have host bindings".
[[tool.importlinter.contracts]]
name = "SDK does not import host transports or mcp_server"
type = "forbidden"
source_modules = ["sdk"]
forbidden_modules = [
    "hosts.cli",
    "hosts.web",
    "mcp_server",
]

# Bundled reference packs may import hosts.core (transport-neutral runtime
# services) but must not import host transports (cli/web).
[[tool.importlinter.contracts]]
name = "SDK packs do not import host transports (cli/web)"
type = "forbidden"
source_modules = [
    "sdk.packs.core",
    "sdk.packs.introspect",
    "sdk.packs.memory",
    "sdk.packs.checkpoint",
]
forbidden_modules = [
    "hosts.cli",
    "hosts.web",
]

# Host layering: cli → web → core. CLI is the top-level orchestrator that
# can launch any host (it imports hosts.web.server for the `desktop`
# subcommand); web wraps core; core must not import either transport.
# The sdk/mcp_server/kernel dependency direction is enforced by the
# forbidden contracts above (kernel forbids hosts; sdk and mcp_server
# forbid host transports). Packs importing hosts.core is a deliberate,
# constrained exception documented in docs/BOUNDARIES.md.
[[tool.importlinter.contracts]]
name = "Host layering (cli → web → core)"
type = "layers"
layers = [
    "hosts.cli",
    "hosts.web",
    "hosts.core",
]

# mcp_server may use kernel/sdk but must not depend on host transport.
[[tool.importlinter.contracts]]
name = "mcp_server does not import host transports"
type = "forbidden"
source_modules = ["mcp_server"]
forbidden_modules = [
    "hosts.cli",
    "hosts.web",
]