[project]
name = "lisa-harness"
version = "0.4.0"
description = "Workspace for the public Lisa Harness packages and examples"
requires-python = ">=3.11"
dependencies = [
    "lisa-harness-kernel",
    "lisa-harness-sdk",
    "lisa-harness-mcp-servers",
    "lisa-pack-memory",
    "lisa-pack-core",
    "lisa-pack-introspect",
    "lisa-pack-recovery",
    "lisa-harness-runtime",
    "lisa-harness-packstest",
    "lisa-harness-e2e",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "import-linter>=2.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
    "vulture>=2.11",
]
mutation = [
    "mutmut>=3,<4 ; sys_platform == 'linux'",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "kernel",
    "sdk",
    "mcp_server",
    "sdk/packs/core",
    "sdk/packs/introspect",
    "sdk/packs/memory",
    "sdk/packs/recovery",
    "runtime",
    "packstest",
    "e2etest",
]

[tool.mutmut]
source_paths = ["scripts"]
only_mutate = ["scripts/check_changed_coverage.py"]
also_copy = ["packstest/tests"]
pytest_add_cli_args_test_selection = ["packstest/tests/test_changed_coverage.py"]
pytest_add_cli_args = ["-x", "-q"]
cache_invalidation_files = ["packstest/tests/test_changed_coverage.py"]
on_dependency_change = "rerun"

[tool.uv.sources]
lisa-harness-kernel = { workspace = true }
lisa-harness-sdk = { workspace = true }
lisa-harness-mcp-servers = { workspace = true }
lisa-pack-memory = { workspace = true }
lisa-pack-core = { workspace = true }
lisa-pack-introspect = { workspace = true }
lisa-pack-recovery = { workspace = true }
lisa-harness-runtime = { workspace = true }
lisa-harness-packstest = { workspace = true }
lisa-harness-e2e = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    "kernel/src",
    "sdk/src",
    "mcp_server/src",
    "runtime/src",
    "packstest/src",
    "e2etest/src",
    "sdk/packs/core/src",
    "sdk/packs/introspect/src",
    "sdk/packs/memory/src",
    "sdk/packs/recovery/src",
    "kernel/tests",
    "sdk/tests",
    "runtime/tests",
]
testpaths = [
    "kernel/tests",
    "sdk/tests",
    "sdk/packs/core/tests",
    "sdk/packs/memory/tests",
    "sdk/packs/recovery/tests",
    "sdk/packs/introspect/tests",
    "mcp_server/tests",
    "mcp_server/src/mcp_server/fetch/tests",
    "mcp_server/src/mcp_server/memory/tests",
    "mcp_server/src/mcp_server/thread/tests",
    "runtime/tests",
    "runtime/src/runtime/model_discovery/tests",
    "packstest/tests",
    "e2etest/tests",
    "kernel/src/kernel/context/tests",
    "sdk/src/sdk/context/tests",
    "sdk/src/sdk/guard/tests",
    "sdk/src/sdk/memory/tests",
    "sdk/src/sdk/storage/tests",
    "sdk/src/sdk/forensics/tests",
]
addopts = "--import-mode=importlib"
consider_namespace_packages = true
# A test marked xfail that unexpectedly passes must fail the suite, so a fixed
# bug flips its regression guard back on instead of silently staying skipped.
xfail_strict = true
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.coverage.run]
# Branch coverage: partial branches (e.g. an `if` whose else never runs) count
# as uncovered, which catches the ``if not x: return`` guards line coverage hides.
branch = true
relative_files = true
source = ["scripts"]
# Omit test code from measurement entirely so reports and fail_under reflect the
# shipped source, not the suites exercising it (pytest's pythonpath imports test
# modules as top-level packages, so omit-by-pattern is required — [paths] alone
# would still record them).
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
]
source_pkgs = [
    "kernel",
    "sdk",
    "mcp_server",
    "runtime",
    "packstest",
    "e2etest",
    "sdk.packs",
]

[tool.coverage.paths]
# Map installed-package paths (pytest pythonpath roots) and local src/ layout to
# one logical tree so a run from any interpreter reports the same files.
source = [
    "kernel/src",
    "*/kernel/src",
    "sdk/src",
    "*/sdk/src",
    "mcp_server/src",
    "*/mcp_server/src",
    "runtime/src",
    "*/runtime/src",
    "packstest/src",
    "*/packstest/src",
    "e2etest/src",
    "*/e2etest/src",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Source-only gate (test code omitted in [tool.coverage.run]). Floors are set ~2
# points under the measured branch-coverage baseline so they catch real regressions
# without flapping on platform noise; ratchet them up over time (see
# docs/TESTING.md for the source-only, per-package gate contract).
fail_under = 82
exclude_also = [
    # Test code is not part of the shipped surface; measuring it inflates totals.
    ".*/tests/.*",
    ".*/test_[^/]*\\.py$",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vulture_allowlist.py"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "PL",
    "C90",
    "RET",
    "RUF",
    "W",
    "YTT",
    "C4",
    "PERF",
    "PIE",
    "FURB",
    "G",
]
# PLR0913 (too-many-arguments): the kernel's hook seams intentionally
# take many parameters — a params-object indirection would hide the
# protocol contract.
# PLC0415 (import-outside-top-level): function-local imports are a
# deliberate codebase pattern — cycle-breaking between co-dependent
# modules (turn_runner ↔ turn_phases), startup-latency control
# (runtime.__getattr__ lazy loaders), and test patch seams. Sites that
# exist only for cycle reasons carry an inline `noqa: PLC0415` with a
# rationale comment; the pattern itself is allowed.
# RUF001/RUF002/RUF003 (ambiguous-unicode): the house style uses
# typographic characters (×, –, —, box-drawing rules) in docstrings,
# comments, and user-facing prose deliberately.
ignore = ["PLR0913", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Test files use function-local imports (lazy dep loading) and literal
# values in assertions — both are intentional and noisy under PLC0415/PLR2004.
"**/tests/**" = ["PLC0415", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 50
max-locals = 15

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = [
    "kernel/src/kernel",
    "sdk/src/sdk",
    "mcp_server/src/mcp_server",
    "runtime/src/runtime",
    "sdk/packs/core/src",
    "sdk/packs/memory/src",
    "sdk/packs/introspect/src",
    "sdk/packs/recovery/src",
    "packstest/src/packstest",
    "e2etest/src/e2etest",
]
mypy_path = [
    "$MYPY_CONFIG_FILE_DIR/typings",
    "$MYPY_CONFIG_FILE_DIR/kernel/src",
    "$MYPY_CONFIG_FILE_DIR/sdk/src",
    "$MYPY_CONFIG_FILE_DIR/mcp_server/src",
    "$MYPY_CONFIG_FILE_DIR/runtime/src",
    "$MYPY_CONFIG_FILE_DIR/sdk/packs/core/src",
    "$MYPY_CONFIG_FILE_DIR/sdk/packs/memory/src",
    "$MYPY_CONFIG_FILE_DIR/sdk/packs/introspect/src",
    "$MYPY_CONFIG_FILE_DIR/sdk/packs/recovery/src",
    "$MYPY_CONFIG_FILE_DIR/packstest/src",
    "$MYPY_CONFIG_FILE_DIR/e2etest/src",
]
explicit_package_bases = true
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["vulture_allowlist.py", '(^|/)(tests|test_[^/]*\.py$)']

[tool.vulture]
paths = [
    "kernel/src/kernel",
    "sdk/src/sdk",
    "mcp_server/src/mcp_server",
    "runtime/src/runtime",
    "sdk/packs/core/src",
    "sdk/packs/memory/src",
    "sdk/packs/introspect/src",
    "sdk/packs/recovery/src",
    "packstest/src",
    "e2etest/src",
    "vulture_allowlist.py",
]
min_confidence = 80
exclude = [
    "**/tests/",
    "**/test_*.py",
    "**/conftest.py",
    "**/*egg-info*/",
    "**/__pycache__/",
    ".venv/",
]
ignore_names = [
    "main",
    "mcp",
    "*SignalCollector",
    "*Collector",
    "*ProcessingLoop",
    "*Detector",
    "*Registry",
    "*Store",
    "*Broker",
    "*Catalog",
    "*Spec",
    "*Config",
    "*Policy",
    "*Manifest",
    "*Error",
    "*Exception",
    "*Context",
    "*Fragments",
    "*Sections",
    "*Evidence",
    "*Summary",
    "*Anomalies",
]
ignore_decorators = [
    "@mcp.tool",
    "@property",
    "@router.get",
    "@router.post",
]

# ---------------------------------------------------------------------------
# import-linter — enforces the architectural boundaries documented in
# docs/BOUNDARIES.md.  Run with:  uv run lint-imports
#
# The codebase uses root-level import paths (kernel, sdk, runtime, mcp_server)
# rather than installed distribution names, so we use those here.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = [
    "kernel",
    "sdk",
    "mcp_server",
    "runtime",
]

# The kernel defines contracts; integrations depend on it, never the reverse.
[[tool.importlinter.contracts]]
name = "Kernel imports no integration packages"
type = "forbidden"
source_modules = ["kernel"]
forbidden_modules = [
    "runtime",
    "sdk",
    "mcp_server",
]

# SDK and bundled packs use kernel contracts, not runtime or server wiring.
[[tool.importlinter.contracts]]
name = "SDK imports no runtime or MCP server wiring"
type = "forbidden"
source_modules = ["sdk"]
forbidden_modules = [
    "mcp_server",
    "runtime",
]

[[tool.importlinter.contracts]]
name = "MCP servers import no runtime wiring"
type = "forbidden"
source_modules = ["mcp_server"]
forbidden_modules = ["runtime"]

[[tool.importlinter.contracts]]
name = "Bundled packs are independent"
type = "independence"
modules = ["sdk.packs.core", "sdk.packs.memory", "sdk.packs.introspect", "sdk.packs.recovery"]
