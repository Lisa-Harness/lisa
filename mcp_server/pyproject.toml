[project]
name = "mcp-server"
version = "0.1.0"
description = "Kernel-as-MCP servers: context, operations, search, surf"
readme = "README.md"
authors = [
    { name = "Adam Migus", email = "adam@migus.org" }
]
requires-python = ">=3.11"
dependencies = [
    "lisa-kernel",
    "mcp>=1.28.0",
    "pydantic>=2.13.4",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
lisa-context = "lisa_context.server:main"
lisa-operations = "lisa_operations.server:main"
lisa-search = "lisa_search.server:main"
lisa-surf = "lisa_surf.server:main"
lisa-guard = "lisa_guard.server:main"
lisa-storage = "lisa_storage.server:main"
lisa-content = "lisa_content.server:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
lisa-kernel = { workspace = true }