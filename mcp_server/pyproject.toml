[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.uv.sources]
lisa-harness-kernel = { workspace = true }
lisa-harness-sdk = { workspace = true }

[project]
name = "lisa-harness-mcp-servers"
version = "0.1.0"
description = "Lisa first-party MCP servers — context, memory, guard, content, catalog, storage, thread, and shared CLI config"
requires-python = ">=3.11"

dependencies = [
    "lisa-harness-kernel",
    "lisa-harness-sdk",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
]

[project.scripts]
lisa-context = "mcp_server.context.server:main"
lisa-memory = "mcp_server.memory.server:main"
lisa-guard = "mcp_server.guard.server:main"
lisa-content = "mcp_server.content.server:main"
lisa-catalog = "mcp_server.catalog.server:main"
lisa-storage = "mcp_server.storage.server:main"
lisa-thread = "mcp_server.thread.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]
