[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk_packs.learning*"]

[tool.setuptools.package-data]
"sdk_packs.learning" = ["mcp_servers.yaml", "modes/**/*.md", "operations/**/*.md", "operations/**/*.yml"]

[project]
name = "lisa-pack-learning"
version = "0.1.0"
description = "Lisa learning pack - memory-backed default and learn workflows"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]

[project.entry-points."lisa.extensions.content_roots"]
learning = "sdk_packs.learning:get_content_root"
