[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_pack_model_advisor*"]

[tool.setuptools.package-data]
"lisa_pack_model_advisor" = ["modes/**/*.md", "operations/**/*.md", "operations/**/*.yml", "operations/**/prompts/*.md"]

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }

[project]
name = "lisa-pack-model-advisor"
version = "0.1.0"
description = "Lisa model advisor pack - natural-language model manifest editing"
requires-python = ">=3.11"

dependencies = [
    "lisa-kernel",
    "lisa-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
model-advisor = "lisa_pack_model_advisor:get_content_root"