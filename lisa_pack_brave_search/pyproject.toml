[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_pack_brave_search*"]

[tool.setuptools.package-data]
"lisa_pack_brave_search" = ["tools/**/*.yml"]

[project]
name = "lisa-pack-brave-search"
version = "0.1.0"
description = "Lisa Brave search provider pack - concrete web_search tool implementation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.entry-points."lisa.extensions.content_roots"]
brave-search = "lisa_pack_brave_search:get_content_root"
