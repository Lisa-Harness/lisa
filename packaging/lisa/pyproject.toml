[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lisa"
version = "0.1.0"
description = "Lisa — an agent framework with a terminal host, pack manager, and MCP-first architecture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ai", "agent", "llm", "mcp", "cli", "framework"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# The meta-package depends on lisa-host-cli, which provides the `lisa`
# console script ([project.scripts] lisa = "hosts.cli.main:main") and
# pulls in the full transitive dependency chain: lisa-host-core,
# lisa-kernel, lisa-sdk, lisa-mcp-servers, and the bundled packs
# (core, learning, search, checkpoint). External packs (cloudflare,
# github, stripe, mem0, brave_search, gmail) are NOT included — they
# are installed on demand via `/pack install <name>`.
dependencies = [
    "lisa-host-cli>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/lisa-framework/lisa"
Repository = "https://github.com/lisa-framework/lisa"

[tool.hatch.build.targets.wheel]
# This is a pure meta-package with no code of its own. The `lisa` console
# script is declared by lisa-host-cli and surfaces automatically through
# the dependency. We only need to ship the README for PyPI rendering.
packages = ["."]