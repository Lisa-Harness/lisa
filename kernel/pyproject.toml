[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel"]

[project]
name = "lisa-harness-kernel"
version = "0.1.0"
description = "Lisa kernel — runtime-neutral FSM engine, contracts, operation registry, and telemetry primitives"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.40.0,<2.0.0",
    "opentelemetry-sdk>=1.40.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.0.0",
    # On Windows, Python's zoneinfo has no system tz database, so the
    # tzdata package is required for IANA timezone resolution.
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "types-PyYAML>=6.0",
]
memory = [
    "sqlite-vec>=0.1.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]
