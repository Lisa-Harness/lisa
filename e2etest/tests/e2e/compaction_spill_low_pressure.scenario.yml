id: harness/compaction-spill-low-pressure
session_context: session_context.md
model:
  script: model/compaction_spill_low_pressure.py
packs:
  - lisa-pack-core
turns:
  - seed 01
  - seed 02
  - seed 03
  - seed 04
  - seed 05
  - seed 06
  - seed 07
  - seed 08
  - seed 09
  - seed 10
  - seed 11
  - seed 12
  - seed 13
  - seed 14
  - seed 15
  - seed 16
  - seed 17
  - seed 18
  - seed 19
  - seed 20
  - probe low pressure
budgets:
  max_messages: 80
  max_continues: 0
  max_yield_replies: 0
  wall_clock_s: 300
oracles:
  hygiene:
    - not_aborted: {}
    - no_turn_errors: {}
    - no_runtime_errors: {}
  behavior:
    - exchange_contains: {text: "confirmed inline large thread_read_recent output"}
    - data_check:
        argv:
          - python
          - -c
          - |
            import pathlib, sys
            needle = "[spilled tool result"
            root = pathlib.Path("${RUN_DIR}") / "data" / "data" / "threads"
            text = ""
            for path in root.rglob("*.jsonl"):
                text += path.read_text(encoding="utf-8", errors="ignore")
            sys.exit(0 if needle not in text else 1)
