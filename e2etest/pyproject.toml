[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e2etest"]

[project]
name = "lisa-harness-e2e"
version = "0.3.0"
description = "End-to-end scenario harness: drives a full Lisa runtime through pack workflows"
requires-python = ">=3.11"

dependencies = [
    "lisa-harness-kernel",
    "lisa-harness-sdk",
    "lisa-harness-runtime",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
lisa-e2e = "e2etest.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.sources]
lisa-harness-kernel = { workspace = true }
lisa-harness-sdk = { workspace = true }
lisa-harness-runtime = { workspace = true }
