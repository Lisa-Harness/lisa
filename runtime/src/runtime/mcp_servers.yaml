---
version: 1

# Host-side policy for pack-contributed MCP servers.
#
# Pack manifests can declare servers with the same ``server_id``; the host
# compiles each one into a namespaced runtime id (<pack_slug>.<server_id>) so
# they co-exist without collision. Use ``exclude_servers`` to suppress specific
# pack-contributed server instances at load time.
#
# Content roots are activation-gated:
# - always_on_packs are always active
# - runtime-installed packs are active by default (can be disabled)
# - bundled packs are inactive until explicitly enabled via /pack enable
#
# Supported formats:
#   - <pack_slug>.<server_id>  (preferred)
#   - <pack_slug>:<server_id>
#   - <pack_slug>/<server_id>
#   - <pack_slug>.*            (exclude all servers from that pack)
#
# Session plans select optional packs and resolve duplicate resource owners.
# This manifest only defines host-owned launch policy and non-overridable
# activation boundaries.
pack_policy:
  exclude_servers: []
  always_on_packs:
    - lisa-pack-core
    - lisa-pack-introspect

# ──────────────────────────────────────────────────────────────────────────
# Memory backends + memory MCP tool servers
# ──────────────────────────────────────────────────────────────────────────
# Memory is a capability declared by the memory pack and other provider packs.
# The runtime selects one implementation through
# ``providers.capabilities.memory`` and publishes the shared ``memory.*``
# contract from that server.
#
# See docs/MEMORY_ARCHITECTURE.md for the layered design.

# ──────────────────────────────────────────────────────────────────────────
# MCP tool servers
# ──────────────────────────────────────────────────────────────────────────
# Host-owned (non-memory) servers are declared here. The host loads them via
# load_mcp_server_manifest and compiles them into MCPClientConfig entries for
# MCPToolPool. Adding, removing, disabling, or changing the launch policy
# (warm/cold/required) of any server is a YAML edit, not a code change.
#
# Memory servers live in provider pack manifests, not here.
#
# Launch policy fields:
#   warm: true  → spawned eagerly at pool.start(); kept alive across turns
#                 with bounded retry and event-driven restart on crash.
#   warm: false → (default) not connected at start; lazily connected on first
#                 list_tools or call_tool that needs it.
#   required: true  → (only with warm) startup failure raises
#                     MCPConnectionError after bounded retry (fails the turn).
#   required: false → (default) startup failure is logged; server's tools are
#                     absent from the catalog.
#   disabled: true  → skipped entirely by the manifest loader; not registered.
#
# tool_policy.allowed_tools/denied_tools list BARE tool names (per-server
# filtering happens before namespacing). The model sees them namespaced
# as <server_id>.<tool_name>.
servers:
  # ── First-party servers (warm — always on, load-bearing) ──
  - server_id: lisa-catalog
    runtime_kind: venv_bin
    venv_dir: "${FRAMEWORK_ROOT}"
    warm: true
    required: true
    tool_policy:
      allowed_tools:
        - list_modes
        - list_operations
        - list_tools

  - server_id: lisa-content
    runtime_kind: venv_bin
    venv_dir: "${FRAMEWORK_ROOT}"
    warm: true
    required: true
    tool_policy:
      # File-reading tools are internal-only; the kernel's
      # MCPContentRegistry calls them via its own stdio sessions.
      allowed_tools: []

  # ── First-party servers (cold — lazily connected on first use) ──
  - server_id: lisa-guard
    runtime_kind: venv_bin
    venv_dir: "${FRAMEWORK_ROOT}"

  # No data_dir_subdir: manifests (models.yaml, models.proposed.yaml) live at
  # the top level of the host data_dir, and the server creates its own
  # ``files/`` subdir internally via init_storage().
  #
  # ``capability: storage`` makes this the built-in implementation of the
  # storage capability: the pool publishes its tools as ``storage.*``
  # (implementation-independent ids) and any competing implementation
  # (e.g. the Go Connector SDK binary from a pack) resolves against it —
  # session ``providers.capabilities.storage: <pack>`` selects the alternate.
  - server_id: lisa-storage
    capability: storage
    capability_tools:
      - read_file
      - read_file_range
      - write_file
      - append_file
      - list_files
      - delete_file
      - stat_file
      - make_dir
      - read_model_manifest
      - write_model_manifest
    runtime_kind: venv_bin
    venv_dir: "${FRAMEWORK_ROOT}"
    warm: false
    data_dir_subdir: "."
    # Ambient MCP-native tools: published as ``storage.read_file`` etc.
    # and merged into every mode's allowed_tool_ids by the SDK catalog
    # loader (same ambient contract as ``recall_memory`` /
    # ``fetch_page``), so modes can read persisted artifacts without
    # re-listing the tool. List bare published names here only; modes opt
    # out via ``excluded_tool_ids`` or ``accept_default_capabilities: false``.
    default_available_tools:
      - read_file
      - read_file_range
      - list_files
      - stat_file
      - write_file
      - append_file

  # ── Thread-access server (cold — lazily connected on first use) ──
  # The thread server exposes bounded reads, search, and content
  # expansion so the model can pull older conversation
  # entries on demand (the on-demand depth layer of the floor + tool
  # design). The eager floor (recent excerpt + thread manifest) is
  # injected by context_assembly; this server lets the model read
  # deeper when the manifest shows entries it needs.
  #
  # ``capability: thread`` makes this the built-in thread implementation:
  # tools publish as ``thread.*`` ids regardless of which implementation
  # is selected (session ``providers.capabilities.thread: <pack>``
  # swaps in the Go Connector SDK binary).
  - server_id: lisa-thread
    capability: thread
    capability_tools:
      - thread_read_range
      - thread_read_recent
      - thread_search
      - thread_read_content
      - thread_find_content
      - thread_task_view
    runtime_kind: venv_bin
    venv_dir: "${FRAMEWORK_ROOT}"
    warm: false
    # The thread store base path is <thread-dir>/<user-slug>. The host
    # sets LISA_THREAD_DIR and LISA_USER_SLUG env vars from the runtime
    # config; the compiler expands them into cli_args at launch time.
    cli_args:
      - "--thread-dir"
      - "${LISA_THREAD_DIR}"
      - "--user-slug"
      - "${LISA_USER_SLUG}"
    # Ambient MCP-native tools, published as ``thread.thread_read_range``
    # etc. and merged into every mode's allowed_tool_ids by the SDK
    # catalog loader, so modes can read prior thread entries without
    # re-listing the tool.
    default_available_tools:
      - thread_read_range
      - thread_read_recent
      - thread_search
      - thread_read_content
      - thread_find_content
      - thread_task_view