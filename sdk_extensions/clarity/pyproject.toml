[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk_extensions.clarity*"]

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }

[project]
name = "lisa-ext-clarity"
version = "0.1.0"
description = "Lisa extension — Microsoft Clarity live-insights signal connector"
requires-python = ">=3.11"

dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "aiohttp>=3.9.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.signal_connectors"]
clarity = "sdk_extensions.clarity.connector:ClaritySignalConnector"

[project.entry-points."lisa.extensions.scheduled_jobs"]
clarity = "sdk_extensions.clarity.jobs:build_clarity_jobs"

[project.entry-points."lisa.extensions.debug_context"]
clarity = "sdk_extensions.clarity.diagnostics:build_debug_context_fragments"

[project.entry-points."lisa.extensions.anomaly_detectors"]
clarity = "sdk_extensions.clarity.anomalies:build_anomaly_detectors"

[project.entry-points."lisa.extensions.heartbeat_context"]
clarity = "sdk_extensions.clarity.heartbeat_context:build_heartbeat_context_fragments"

[project.entry-points."lisa.extensions.context_evidence"]
clarity = "sdk_extensions.clarity.context_evidence:build_context_evidence"
