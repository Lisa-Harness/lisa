[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk_extensions.github*"]

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }

[project]
name = "lisa-ext-github"
version = "0.1.0"
description = "Lisa extension — GitHub repository and CI/CD health signal connector"
requires-python = ">=3.11"

dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.signal_connectors"]
github = "sdk_extensions.github.connector:GitHubSignalConnector"

[project.entry-points."lisa.extensions.anomaly_detectors"]
github = "sdk_extensions.github.anomalies:build_anomaly_detectors"

[project.entry-points."lisa.extensions.heartbeat_context"]
github = "sdk_extensions.github.heartbeat_context:build_heartbeat_context_fragments"

[project.entry-points."lisa.extensions.digest_sections"]
github = "sdk_extensions.github.digest:build_digest_sections"

[project.entry-points."lisa.extensions.context_evidence"]
github = "sdk_extensions.github.context_evidence:build_context_evidence"

[project.entry-points."lisa.extensions.refresh_summary_sections"]
github = "sdk_extensions.github.refresh_summary:build_refresh_summary_sections"
