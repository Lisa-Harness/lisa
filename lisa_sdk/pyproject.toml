[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["lisa_sdk*"]

[tool.uv.sources]
lisa-kernel = { workspace = true }

[project]
name = "lisa-sdk"
version = "0.1.0"
description = "Lisa SDK — reusable operations, modes, signal connector shims, and domain models for Lisa-powered bots"
requires-python = ">=3.11"

dependencies = [
    "lisa-kernel",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
lisa_sdk = "lisa_sdk:get_content_root"
