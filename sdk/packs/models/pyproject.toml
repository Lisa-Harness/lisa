[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk.packs.models*"]

[tool.setuptools.package-data]
"sdk.packs.models" = ["modes/**/*.md", "operations/**/*.md", "operations/**/*.yml", "operations/**/prompts/*.md"]

[project]
name = "lisa-pack-models"
version = "0.1.0"
description = "Lisa model-picker pack - natural-language model manifest editing"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
models = "sdk.packs.models:get_content_root"