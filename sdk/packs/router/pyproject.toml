[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk.packs.router*"]

[project]
name = "lisa-pack-router"
version = "0.1.0"
description = "Lisa router pack - built-in rules-based model router"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.model_routers"]
lisa-router = "sdk.packs.router:get_router_factory"

[project.entry-points."lisa.extensions.model_router_configs"]
lisa-router = "sdk.packs.router.default_config:get_default_router_config"

[project.entry-points."lisa.extensions.model_roles"]
deep = "sdk.packs.router:get_declared_roles"