[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk.packs.markdown*"]

[tool.setuptools.package-data]
"sdk.packs.markdown" = [
    "modes/**/*.md",
    "operations/**/*.md",
    "operations/**/*.yml",
    "operations/**/prompts/*.md",
    "tools/**/*.yml",
]

[project]
name = "lisa-pack-markdown"
version = "0.1.0"
description = "Lisa markdown pack - memory-grounded markdown document forging with markdown-it-py"
requires-python = ">=3.11"
dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "markdown-it-py>=3.0.0",
    "mdformat>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
markdown = "sdk.packs.markdown:get_content_root"
