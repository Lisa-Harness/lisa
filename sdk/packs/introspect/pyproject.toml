[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdk"]
only-include = ["src/sdk/packs/introspect"]

[project]
name = "lisa-pack-introspect"
version = "0.3.0"
description = "Lisa introspect pack - operational self-model, architecture atlas, and reflective self-assessment operations"
requires-python = ">=3.11"
dependencies = [
    "lisa-harness-kernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.entry-points."lisa.extensions.content_roots"]
introspect = "sdk.packs.introspect:get_content_root"