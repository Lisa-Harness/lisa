operation_id: docforge_forge_document
description: Combine user input with recalled memory context (and optionally an existing document), synthesize or revise a markdown document via an LLM, validate its structure with the markdown-it-py outline tool, and persist it to lisa-storage.
mode_allowlist: [docforge]
tool_ids: [docforge_outline_markdown, write_file, read_file, memory.search]
timeout_seconds: 60
max_calls_per_turn: 3
completion_max_tokens: 4000
completion_temperature: 0.2
preferred_model_id: default
