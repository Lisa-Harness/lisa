[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# sdk.packs.core lives under the shared sdk namespace; hatchling includes
# all files in the package dir by default (no package-data globs needed).
packages = ["src/sdk"]
only-include = ["src/sdk/packs/core"]

[project]
name = "lisa-pack-core"
version = "0.1.2"
description = "Lisa core pack - baseline modes, operations, and authored content"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
core = "sdk.packs.core:get_content_root"
