[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdk"]
only-include = ["src/sdk/packs/recovery"]

[project]
name = "lisa-pack-recovery"
version = "0.4.0"
description = "Lisa recovery pack - operator commands for interrupted dispatch work items"
requires-python = ">=3.11"

dependencies = [
    "lisa-harness-kernel",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.entry-points."lisa.extensions.content_roots"]
recovery = "sdk.packs.recovery:get_content_root"

[project.entry-points."lisa.extensions.host_commands"]
recovery = "sdk.packs.recovery.commands:get_host_commands"