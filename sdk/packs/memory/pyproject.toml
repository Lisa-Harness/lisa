[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk.packs.memory*"]

[tool.setuptools.package-data]
"sdk.packs.memory" = ["mcp_servers.yaml", "modes/**/*.md", "operations/**/*.md", "operations/**/*.yml"]

[project]
name = "lisa-pack-memory"
version = "0.1.0"
description = "Lisa memory pack - memory-backed default and remember workflows"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["tests"]

[project.entry-points."lisa.extensions.content_roots"]
memory = "sdk.packs.memory:get_content_root"

[project.entry-points."lisa.extensions.slice_providers"]
memory_consolidation = "sdk.packs.memory.slice_provider:get_slice_provider_factory"
