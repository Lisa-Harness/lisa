[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdk"]
only-include = ["src/sdk/packs/memory"]

[project]
name = "lisa-pack-memory"
version = "0.2.0"
description = "Lisa memory pack - memory-backed default and remember workflows"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.entry-points."lisa.extensions.content_roots"]
memory = "sdk.packs.memory:get_content_root"

[project.entry-points."lisa.extensions.slice_providers"]
memory_consolidation = "sdk.packs.memory.slice_provider:get_slice_provider_factory"
