[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["sdk.packs.coding*"]

[tool.setuptools.package-data]
"sdk.packs.coding" = ["modes/**/*.md", "tools/**/*.yml"]

[project]
name = "lisa-pack-coding"
version = "0.1.0"
description = "Provider-neutral local coding workflow tools for Lisa"
requires-python = ">=3.11"
dependencies = ["lisa-kernel", "lisa-sdk"]

[project.entry-points."lisa.extensions.content_roots"]
coding = "sdk.packs.coding:get_content_root"