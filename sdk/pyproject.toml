[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# sdk is a PEP 420 namespace shared with the packs: the wheel must carry
# only sdk/ minus the packs subtree (packs ship their own wheels).
packages = ["src/sdk"]
exclude = ["src/sdk/packs"]

[tool.uv.sources]
lisa-harness-kernel = { workspace = true }

[project]
name = "lisa-harness-sdk"
version = "0.4.0"
description = "Lisa SDK — reusable operations, modes, signal connector shims, and domain models for Lisa-powered bots"
requires-python = ">=3.11"

dependencies = [
    "lisa-harness-kernel",
    "httpx>=0.27.0",
    "openai>=1.59.0",
    "pydantic>=2.13.4",
    "sqlite-vec>=0.1.9",
    # SQLite-backed on-disk cache for the SDK ContentFetcher primitive
    # (fetch-and-cache remote documents). Pure-Python, thread-safe, no server.
    "diskcache>=5.6",
    # Copilot customization file globbing (applyTo / paths). Supports **,
    # brace alternation, and comma-lists the way Copilot's matcher does.
    "wcmatch>=8.5",
    # CEL expression engine for the built-in lisa-router backend.
    # Rules are compiled eagerly at router construction and evaluated
    # per iteration against the turn/router/model activation context.
    "cel-python>=0.5.0",
    "tiktoken>=0.12.0",
]

[project.optional-dependencies]
bedrock = [
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
sdk = "sdk._content_root:get_content_root"

# Built-in lisa-router backend — a runtime ModelRouter, not a pack.
# See sdk/router/ and router/README.md.
[project.entry-points."lisa.extensions.model_routers"]
lisa-router = "sdk.router:get_router_factory"

[project.entry-points."lisa.extensions.model_router_configs"]
lisa-router = "sdk.router.default_config:get_default_router_config"

# Built-in provider gateways — a runtime ProviderGatewayProvider backend,
# not a pack. See sdk/providers/ and the kernel's ProviderGatewayProvider
# protocol. Discovered via kernel.provider_gateway_discovery.
[project.entry-points."lisa.extensions.provider_gateways"]
sdk = "sdk.providers:get_provider_gateway_provider_factory"

