---
version: 1

# Memory backends are declared as a peer list. Each entry has an id, a kind
# (http | stdio), connection details, and tool_names mapping the generic
# memory.add/search/list aliases to that backend's actual MCP tool names.
# default_backend picks one by id; the host wires it behind the generic
# memory.* synthetic tools. Adding a new backend is a YAML entry, not a
# code change.
memory:
  default_backend: mem0
  backends:
    # Mem0 cloud — HTTP MCP, bearer-token auth. Stores data server-side.
    - id: mem0
      kind: http
      url: https://mcp.mem0.ai/mcp
      headers:
        Authorization: "Bearer ${MEM0_API_KEY}"
      agent_id: lisa
      tool_names:
        add: add_memory
        search: search_memories
        list: get_memories

    # lisa-context — first-party stdio MCP server. Available as a peer so it
    # can be swapped in as the default or used directly via router.backend().
    - id: lisa-context
      kind: stdio
      command: "${LISA_MCP_COMMAND}"
      args:
        - --data-dir
        - "${LISA_DATA_DIR}"
      tool_names:
        add: add_memory
        search: search_memory
        list: list_memories

# No standalone MCP servers are declared here; all first-party MCP servers
# Little Lisa uses are registered in code (examples/little_lisa/main.py
# _compile_mcp_configs). Memory backends live above under memory.backends.
servers: []