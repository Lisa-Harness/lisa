---
version: 1

# Memory backends are declared as a peer list. Each entry has an id, a kind
# (http | stdio), connection details, and tool_names mapping the generic
# memory.add/search/list aliases to that backend's actual MCP tool names.
# default_backend picks one by id; the host wires it behind the generic
# memory.* synthetic tools. Adding a new backend is a YAML entry, not a
# code change.
#
# Backends are ALSO registered as tool servers (below under `servers`) so
# their full tool surface is available to modes that declare them. The
# three core aliases route to the default backend; the backend's other
# tools (e.g. Mem0's update_memory, delete_memory, list_entities) are
# directly callable by their namespaced name (server_id.tool_name, e.g.
# mem0.search_memories) from any mode that allows them.  Both backends'
# tools appear in the catalog without collision — namespacing eliminates
# the cross-server name clash (e.g. lisa-memory.add_memory vs
# mem0.add_memory) by construction.
memory:
  default_backend: mem0
  backends:
    # lisa-memory — first-party stdio MCP server. The minimal built-in: three
    # core memory calls backed by local SQLite. Default backend for memory.*.
    - id: lisa_memory
      kind: stdio
      command: "${LISA_MCP_COMMAND:lisa-memory}"
      args:
        - --data-dir
        - "${LISA_DATA_DIR}"
      tool_names:
        add: add_memory
        search: search_memory
        list: list_memories

    # Mem0 cloud — HTTP MCP, bearer-token auth. Serves the three core calls
    # (so it can be swapped in as the default) plus its full surface
    # (update/delete/get/entities/events) as a tool server. Set
    # default_backend: mem0 and provide MEM0_API_KEY to make it the default.
    - id: mem0
      kind: http
      url: https://mcp.mem0.ai/mcp
      headers:
        Authorization: "Bearer ${MEM0_API_KEY}"
      agent_id: lisa
      tool_names:
        add: add_memory
        search: search_memories
        list: get_memories

# External MCP tool servers. Mem0 is registered but only the allowed_tools are
# exposed directly in addition to the three core aliases above still route
# through the default backend (lisa_memory unless overridden).
# Disabled when MEM0_API_KEY is unset — the host's empty-header guard drops
# it from the pool.
# tool_policy.allowed_tools/denied_tools list BARE tool names (per-server
# filtering happens before namespacing).  The model sees them namespaced
# as mem0.<tool_name>.
servers:
  - server_id: mem0
    runtime_kind: http
    url: https://mcp.mem0.ai/mcp
    headers:
      Authorization: "Bearer ${MEM0_API_KEY}"
    tool_policy:
      allowed_tools:
        - search_memories
        - get_memories
      denied_tools:
        - add_memory
        - delete_memory
