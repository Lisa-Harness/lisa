[project]
name = "lisa-framework-examples"
version = "0.1.0"
description = "Shared dependency surface for lisa_framework examples"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]
