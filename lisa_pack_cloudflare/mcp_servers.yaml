version: 1

# Cloudflare API MCP server (Code Mode).
#
# Uses Cloudflare's managed remote MCP server at https://mcp.cloudflare.com/mcp.
# Code Mode exposes 3 tools (docs, search, execute) covering ~2,500 API endpoints
# at ~1,100 schema tokens, instead of ~244k tokens for native MCP tools.
#
# Authentication: bearer token via CLOUDFLARE_MCP_API_TOKEN env var.
# The token MUST be a read-only Cloudflare API token. The `execute` tool can
# issue mutating API requests — read-only enforcement is at the Cloudflare
# token scope, not the prompt or tool allowlist.
#
# Cold server: only connected when the `cloudflare` mode is active and one
# of the alias tools is in the mode's allowed_tool_ids.
servers:
  - server_id: cloudflare-api
    runtime_kind: http
    url: https://mcp.cloudflare.com/mcp
    headers:
      Authorization: "Bearer ${CLOUDFLARE_MCP_API_TOKEN}"
    warm: false
    tool_policy:
      allowed_tools:
        - docs
        - search
        - execute
    aliases:
      - alias_name: cloudflare.docs
        native_tool: docs
        description: Search Cloudflare developer documentation.
      - alias_name: cloudflare.search
        native_tool: search
        description: Write JavaScript to search the Cloudflare API spec and find endpoints.
      - alias_name: cloudflare.execute
        native_tool: execute
        description: Write JavaScript to execute Cloudflare API calls (read-only token).