[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_pack_cloudflare*"]

[tool.setuptools.package-data]
"lisa_pack_cloudflare" = ["content/**/*.md", "modes/**/*.md", "operations/**/*.md", "operations/**/*.yml", "operations/**/*.py"]

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }

[project]
name = "lisa-pack-cloudflare"
version = "0.1.0"
description = "Lisa Cloudflare pack - zone and worker status signal connector plus status mode"
requires-python = ">=3.11"

dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require Azurite on localhost:10000",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
cloudflare = "lisa_pack_cloudflare:get_content_root"

[project.entry-points."lisa.extensions.signal_connectors"]
cloudflare = "lisa_pack_cloudflare.connector:CloudflareSignalCollector"

[project.entry-points."lisa.extensions.context_evidence"]
cloudflare = "lisa_pack_cloudflare.context_evidence:build_context_evidence"

[project.entry-points."lisa.extensions.processing_loops"]
cloudflare = "lisa_pack_cloudflare.processing:CloudflareProcessingLoop"