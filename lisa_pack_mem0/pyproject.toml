[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_pack_mem0*"]

[tool.setuptools.package-data]
"lisa_pack_mem0" = ["mcp_servers.yaml"]

[project]
name = "lisa-pack-mem0"
version = "0.1.0"
description = "Lisa Mem0 provider pack - external memory backend and MCP server manifest"
requires-python = ">=3.11"

[project.entry-points."lisa.extensions.content_roots"]
mem0 = "lisa_pack_mem0:get_content_root"
