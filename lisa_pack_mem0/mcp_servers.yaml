---
version: 1

# External Mem0 provider for memory capability ownership.
# When selected by host policy, this pack owns memory aliases and routes
# memory.add/search/list through Mem0.
memory:
  default_backend: mem0
  backends:
    - id: mem0
      kind: http
      url: https://mcp.mem0.ai/mcp
      headers:
        Authorization: "Bearer ${MEM0_API_KEY}"
      agent_id: lisa
      tool_names:
        add: add_memory
        search: search_memories
        list: get_memories

servers:
  - server_id: mem0
    runtime_kind: http
    url: https://mcp.mem0.ai/mcp
    headers:
      Authorization: "Bearer ${MEM0_API_KEY}"
    tool_policy:
      denied_tools:
        - delete_all_memories
        - delete_entitites
        - delete_memory
    proxy_policy:
      ambient:
        user_id: user_slug
      structured_filters: true
