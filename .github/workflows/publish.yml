name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    name: Validate release commit
    uses: ./.github/workflows/ci.yml

  docs:
    name: Validate documentation
    uses: ./.github/workflows/docs.yml

  build:
    name: Build distributions
    needs: [ci, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and package versions
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          packages = {
              "kernel": "lisa-harness-kernel",
              "sdk": "lisa-harness-sdk",
              "mcp_server": "lisa-harness-mcp-servers",
              "sdk/packs/core": "lisa-pack-core",
              "sdk/packs/introspect": "lisa-pack-introspect",
              "sdk/packs/memory": "lisa-pack-memory",
              "sdk/packs/recovery": "lisa-pack-recovery",
              "runtime": "lisa-harness-runtime",
              "packstest": "lisa-harness-packstest",
              "e2etest": "lisa-harness-e2e",
          }
          tag = os.environ["RELEASE_TAG"]
          for directory, expected_name in packages.items():
              project = tomllib.loads(Path(directory, "pyproject.toml").read_text())["project"]
              if project["name"] != expected_name:
                  raise SystemExit(
                      f"{directory}: expected distribution {expected_name!r}, "
                      f"found {project['name']!r}"
                  )
              expected_tag = f"v{project['version']}"
              if tag and tag != expected_tag:
                  raise SystemExit(
                      f"release tag {tag!r} does not match {expected_name} version "
                      f"{project['version']!r} (expected {expected_tag!r})"
                  )
          PY

      - name: Build packages
        run: |
          uv build --no-sources --all-packages --out-dir dist

      - name: Verify build outputs
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 10
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 10
          uvx --from twine twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }} to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - lisa-harness-kernel
          - lisa-harness-sdk
          - lisa-harness-mcp-servers
          - lisa-harness-runtime
          - lisa-harness-packstest
          - lisa-harness-e2e
          - lisa-pack-core
          - lisa-pack-introspect
          - lisa-pack-memory
          - lisa-pack-recovery
    environment:
      name: pypi-${{ matrix.package }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Select package distributions
        env:
          PACKAGE_NAME: ${{ matrix.package }}
        run: |
          mkdir publish
          distribution="${PACKAGE_NAME//-/_}"
          cp dist/"${distribution}-"* publish/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/

  release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/

      - name: Publish release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes --latest