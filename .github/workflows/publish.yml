name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build packages
        run: |
          uv build --package lisa-kernel
          uv build --package lisa-sdk
          uv build --package lisa-mcp-servers
          uv build --package lisa-pack-cloudflare
          uv build --package lisa-pack-github
          uv build --package lisa-pack-stripe
          uv build --package lisa-pack-core
          uv build --package lisa-pack-learning
          uv build --package lisa-pack-search
          uv build --package little-lisa

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
