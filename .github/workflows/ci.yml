name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Direct I/O policy (allowlist)
        run: uv run python scripts/check_direct_io_policy.py

      - name: Type check (mypy — all public packages)
        run: uv run mypy kernel sdk mcp_server

      - name: Dead code (vulture)
        run: uv run vulture kernel sdk mcp_server host vulture_allowlist.py

      - name: Unit tests (no live)
        run: uv run pytest -m "not live" --tb=short -v

