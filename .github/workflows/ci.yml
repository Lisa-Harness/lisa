name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Documentation
    uses: ./.github/workflows/docs.yml

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Direct I/O policy (allowlist)
        run: uv run python scripts/check_direct_io_policy.py

      - name: Type check (mypy — all workspace source packages)
        run: uv run --no-sync mypy

      - name: Dead code (vulture)
        run: uv run --no-sync vulture

      - name: Architecture boundaries
        run: uv run --no-sync lint-imports

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Offline tests and coverage (package floors and 95% changed lines)
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: uv run --no-sync python scripts/check_coverage.py --run

  merge-gate:
    name: Merge gate
    if: ${{ always() }}
    needs: [quality, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to pass
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$TEST_RESULT" = success
          test "$DOCS_RESULT" = success
