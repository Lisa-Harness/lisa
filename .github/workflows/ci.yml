name: CI

on:
  workflow_call:
  push:
    branches: [main]
    # A documentation-only change does not affect the code, so the full
    # quality/test/coverage matrix is skipped. The Docs workflow still runs
    # and checks the documentation itself. Markdown that the runtime or the
    # agent host loads -- pack content (modes, operations, prompts,
    # sessions), test fixtures, and Copilot customization files -- is not
    # documentation and is deliberately not ignored here: a README placed
    # in a scanned content directory would need its own exception.
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "**/AUTHORING.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "**/README.md"
      - "**/AUTHORING.md"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Direct I/O policy (allowlist)
        run: uv run python scripts/check_direct_io_policy.py

      - name: Type check (mypy — all public packages)
        env:
          MYPYPATH: typings:kernel/src:sdk/src:mcp_server/src
        run: uv run mypy --explicit-package-bases --exclude '(^|/)(tests|test_[^/]*\.py$)' kernel/src/kernel sdk/src/sdk mcp_server/src/mcp_server

      - name: Dead code (vulture)
        run: uv run vulture kernel/src/kernel sdk/src/sdk mcp_server/src/mcp_server runtime/src/runtime vulture_allowlist.py

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Unit tests (no live)
        run: uv run pytest -m "not live" --tb=short -v

      - name: Coverage gate (per-package floors)
        run: |
          uv run coverage run -m pytest -m "not live" -q
          uv run python scripts/check_coverage.py
