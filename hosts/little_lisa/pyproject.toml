[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["little_lisa*"]

[tool.setuptools.package-data]
"little_lisa" = ["models.yaml", ".env.example"]

[project]
name = "little-lisa"
version = "0.1.0"
description = "Little Lisa — local terminal host for exercising Lisa framework packs"
requires-python = ">=3.11"
dependencies = [
    "lisa-kernel",
    "lisa-sdk",
    "lisa-pack-cloudflare",
    "lisa-pack-github",
    "lisa-pack-stripe",
    "lisa-pack-core",
    "aiohttp>=3.10.0",
    "openai>=1.30.0",
    "pillow>=10.0.0",
    "prompt-toolkit>=3.0.43",
    "pystray>=0.19.5",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
little-lisa = "little_lisa.main:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["."]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "C90", "RET", "RUF"]
ignore = ["PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-returns = 6
max-branches = 12
max-statements = 50
max-locals = 15

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["PLR2004"]  # Test assertions use magic values by design
