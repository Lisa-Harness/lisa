[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["hosts_vscode*"]

[project]
name = "lisa-host-vscode"
version = "0.1.0"
description = "VS Code extension host for the Lisa framework"
requires-python = ">=3.11"
dependencies = [
    "lisa-host-core",
    "lisa-kernel",
    "lisa-sdk",
    "lisa-mcp-servers",
    "lisa-pack-memory",
    "lisa-pack-search",
    "lisa-pack-core",
    "lisa-pack-introspect",
    "lisa-pack-checkpoint",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
lisa-vscode = "hosts.vscode.bridge:main"

[tool.ruff]
line-length = 100
target-version = "py311"