[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["hosts_web*"]

[project]
name = "lisa-host-web"
version = "0.1.0"
description = "Localhost web host for the Lisa framework"
requires-python = ">=3.11"
dependencies = [
    "lisa-host-core",
    "lisa-kernel",
    "lisa-sdk",
    "lisa-mcp-servers",
    "lisa-pack-learning",
    "lisa-pack-search",
    "lisa-pack-core",
    "lisa-pack-checkpoint",
    "aiohttp>=3.10.0",
    "openai>=1.30.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.scripts]
lisa-web = "hosts.web.main:main"

[project.optional-dependencies]
tray = [
    "pystray>=0.19.5",
    "pillow>=10.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["../.."]
testpaths = ["."]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

[tool.ruff]
line-length = 100
target-version = "py311"