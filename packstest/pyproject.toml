[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/packstest"]

[project]
name = "lisa-packstest"
version = "0.1.0"
description = "In-process pack test/eval harness for Lisa content packs"
requires-python = ">=3.11"

dependencies = [
    "lisa-kernel",
    "lisa-sdk",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.uv.sources]
lisa-kernel = { workspace = true }
lisa-sdk = { workspace = true }