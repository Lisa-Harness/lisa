[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/host"]

[project]
name = "lisa-harness-runtime"
version = "0.1.0"
description = "Transport-neutral host runtime for Lisa Harness hosts"
requires-python = ">=3.11"
dependencies = [
    "lisa-harness-kernel",
    "lisa-harness-sdk",
    "lisa-harness-mcp-servers",
    "lisa-pack-memory",
    "lisa-pack-core",
    "lisa-pack-introspect",
    "lisa-pack-recovery",
    "cel-python>=0.5.0",
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic agent regression evals (no model calls, no I/O)",
]

# Ruff/pytest/vulture configuration lives in the workspace root pyproject.toml;
# member-level [tool.ruff] sections would shadow the root per-file-ignores.