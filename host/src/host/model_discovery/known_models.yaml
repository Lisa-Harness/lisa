# Static model registry — hand-curated ground truth for model enrichment.
#
# This file is the fallback when provider APIs don't expose enough metadata.
# It is also the override layer: entries here take precedence over
# provider-derived enrichment for the fields they specify.
#
# Keys are "provider:model_id" (lowercased). Each entry may set any subset
# of the enrichment fields. Fields not set here fall through to the
# provider-derived values.
#
# Maintain this file conservatively. Only add models you have verified.

